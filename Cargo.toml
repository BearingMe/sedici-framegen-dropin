[package]
name = "sedici"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Drop-in replacement for amd_fidelityfx_framegeneration_dx12.dll with Sedici's own frame generation"
publish = false
build = "build.rs"

[lib]
name = "amd_fidelityfx_framegeneration_dx12"
path = "src/lib.rs"
# `cargo test` must be able to link the library. With both crate types in one unit Cargo emits only
# the cdylib for a test binary, so the test link goes through `exports.def` and fails on the five
# `ffx*` symbols (K141). The rlib is what the tests use; the cdylib is restored with the ffx ABI
# exports (port order step 4), which are not ported yet and are why the DLL does not link today.
crate-type = ["cdylib", "rlib"]

[dependencies]
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "registry"] }
tracing-appender = "0.2"
toml_edit = "0.22"
# Config file identity: the file digest is part of the outside-edit check (K43, settings/config_patch).
sha2 = "0.10"
# Dear ImGui's replacement (port-design: "Dear ImGui becomes egui"). Only the UI adapter and the
# view-model renderer use it; the application layer never imports it. No renderer backend is
# enabled: the overlay's D3D12 renderer is written by hand in `adapters/driven/overlay_ui`.
egui = { version = "0.33", default-features = false, features = ["default_fonts"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Security",
    "Win32_Graphics_Direct3D11",
    "Win32_System_Kernel",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Input",
    "Win32_UI_HiDpi",
    "Win32_System_WindowsProgramming",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
]

[dev-dependencies]
rstest = "0.26"

# `#[implement]` (the swapchain wrapper's COM surface) expands to `::windows_core::…` paths, so the
# crate must be a direct dependency, not only a transitive one of `windows`.
[target.'cfg(windows)'.dependencies.windows-core]
version = "0.61"
features = ["std"]

[lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
