# Sedici configuration.
#
# This file lives beside amd_fidelityfx_framegeneration_dx12.dll and is read
# once, on the first ffx* call of the process.
#
# Every key is optional. Delete a key and its built-in default applies; delete
# the whole file and every default applies. The values below ARE the defaults,
# written out so the full set is visible in one place.
#
# Environment variables override this file:
#   SEDICI_PACING=hybrid|off     overrides [pacing] mode
#   SEDICI_ASYNC=0|game          overrides [async] mode
#   MFSRFG_LOG=0|1|2             overrides [log] level
#
# A malformed file is never fatal. Each bad key is reported in sedici.log with
# its line and column, that key falls back to its default, and the rest of the
# file still applies. A syntax error falls back to defaults for every key.
#
# Full reference: README.md. Measurements behind these defaults:
# docs/findings/002-pacing-baseline.md.

[pacing]
# "hybrid" - after each frame generation swapchain is created, send the
#            swapchain frame pacing tuning desc with allowHybridSpin = true.
#            This is the fix: it removes the 50-67 ms frame-time tail without
#            costing throughput.
# "off"    - send nothing; forward everything untouched. Combined with
#            async.mode = "game" this is exact milestone-0 behaviour.
mode = "hybrid"

# Frame pacing sleep safety margin, in milliseconds.
# SDK default: 0.1. Must be finite and >= 0.
safety_margin_ms = 0.1

# Variance factor for consecutive frame times.
# SDK default: 0.1. Must be within [0.0, 1.0].
variance_factor = 0.1

# How long to spin, in timer resolution units, when hybrid spin is allowed.
# The SDK recommends at least 2; lower values overshoot more often.
# SDK default: 2. Must be within [0, 1000].
hybrid_spin_time = 2

# Wait on the fence with WaitForSingleObject instead of spinning for it.
# SDK default: false.
wait_for_single_object_on_fence = false

[async]
# "game" - forward allowAsyncWorkloads exactly as the game sets it.
# "off"  - clear FFX_FRAMEGENERATION_ENABLE_ASYNC_WORKLOAD_SUPPORT from the
#          frame generation create flags and force allowAsyncWorkloads = false
#          in every frame generation configure desc.
#
# This was the second tail fix found in the baseline investigation. It removes
# the same tail as [pacing] and does not stack with it, so it is not the
# default. Kept for A/B testing.
mode = "game"

[fg]
# "amd"    - forward every frame generation call to the original DLL. AMD owns
#            the generator and the swapchain. This is the default and the
#            behaviour every earlier release had.
# "sedici" - use Sedici's own generator and swapchain wrapper. Sedici then owns
#            frame generation for the whole process; there is no per-call
#            fallback, because a context cannot be handed to AMD mid-life.
#            Experimental: not yet verified in a game session.
mode = "amd"

# How Sedici shows its frames when mode = "sedici". Ignored with "amd".
# "vsync" - wait for the screen's refresh before each frame. No tearing, but
#           up to one refresh of extra latency, and the game's own FPS cap must
#           be at or below half the refresh rate (e.g. 37 FPS on a 75 Hz
#           screen). Do not combine with [limiter]. ("vblank" means the same.)
# "vrr"   - for FreeSync/G-Sync screens. Frames are timed from when they are
#           actually finished on the GPU and shown from Sedici's own thread,
#           so the screen gets evenly spaced frames. Lower latency than vsync,
#           works with [limiter]. Keep the real FPS under half the refresh.
# "game"  - use the game's own settings and timing. Lowest latency, but tears.
present = "vsync"

# Only used with present = "vrr". Stops a frame from being shown while the
# screen is still drawing the previous one, which is what a tear is.
# "scanline" - ask the GPU where the screen is in its refresh and wait for the
#              gap between refreshes. Works with or without FreeSync/G-Sync.
# "timer"    - wait at least one refresh since the previous frame. Only
#              prevents tearing on FreeSync/G-Sync screens.
# "off"      - no protection; show each frame as soon as it is due.
tear_guard = "scanline"

[limiter]
# Cap the game's real frames inside Sedici's Present hook, before the original
# Present is called. The generated frames are presented inside AMD's swapchain
# and are not capped; with 2x frame generation the output lands at about twice
# this rate. 0 = off (default, exact milestone-1 behaviour).
#
# Fractions are allowed. Example: 36.5 gives about 73 output fps with 2x frame
# generation. On a 75 Hz panel with VRR (40-75 Hz) that is the usual target:
# inside the VRR window and ~2 fps under the ceiling. 37 gives 74 output.
fps = 0

# Final busy-wait window before the deadline, in microseconds. The high
# resolution waitable timer covers everything before this window; the spin
# covers the last part so the present lands on the deadline rather than on a
# timer tick. 0 = never spin (timer only, coarser). Must be within [0, 100000].
spin_us = 1000

[log]
# 0 = errors only
# 1 = normal: calls, configuration, stats every 300 prepares, and one line per
#     detected prepare stall
# 2 = verbose: every call
level = 1

[ui]
# Overlay menu, drawn on the final output image after frame generation.
# "off"  - nothing until the hotkey is pressed.
# "mini" - one line at startup.
# "full" - full menu at startup.
mode = "off"

# "auto" scales from the output height (1080p = 1.0, clamped to 0.5-2.0), or a
# fixed number in [0.5, 2.0].
scale = "auto"

# Modifier+key. Alt+F10 cycles Off -> Mini -> Full -> Off.
hotkey = "alt+f10"